name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          # 使用 PAT 而非默认 GITHUB_TOKEN：让 release-please 创建的 tag
          # 与 release 能触发下游 release.yml（GITHUB_TOKEN 创建的事件
          # 不会触发其他 workflow）。RELEASE_PLEASE_PAT 是 fine-grained PAT，
          # 需 contents/pull-requests/workflows write，作用域限本仓。
          # 未配置时回退 GITHUB_TOKEN——release/tag 不触发下游，需手动 dispatch。
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
