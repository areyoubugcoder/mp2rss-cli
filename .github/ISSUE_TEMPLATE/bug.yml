name: 🐛 Bug 报告
description: 反馈 mp2rss-cli 在使用中遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 简要描述你遇到的问题
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 `mp2rss ...`
        2. ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI 版本
      description: 运行 `mp2rss --version` 输出
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统 / 架构
      placeholder: macOS 14.5 / arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      render: shell
