# golangci-lint configuration for mp2rss-cli.
# Run locally: golangci-lint run ./...
run:
  timeout: 5m
  go: "1.21"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - gosimple
    - misspell
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: false
      - name: var-naming
        disabled: false
